#
# ONLYOFFICE Document Server embarcado no G2W Cloud — editor de documentos
# integrado (Word/Excel/PowerPoint). Roda em Docker isolado, separado do
# resto da instalação (que é nativa, sem Docker) — o Document Server é um
# serviço Node.js à parte, não tem relação com o PHP/nginx do Nextcloud.
#
# Uso:
#   docker compose up -d
#
# Depois de subir pela primeira vez, rodar scripts/onlyoffice-fix-private-ip.sh
# (instalação 100% interna, sem domínio público — ver pegadinha documentada
# em 01 - Redes/00 - Infraestrutura Zabbix Central/rotinas/implantar-nextcloud-onlyoffice.md)

services:
  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: g2wcloud-onlyoffice
    restart: unless-stopped
    # Porta aberta na rede (não só loopback): o NAVEGADOR do usuário precisa
    # alcançar essa porta pra carregar o editor (JS/iframe/WebSocket) — é
    # diferente da chamada servidor-a-servidor que o Nextcloud faz (essa sim
    # usa DocumentServerInternalUrl=127.0.0.1, resolvido dentro da própria
    # LXC). Publicar só em 127.0.0.1 aqui quebra o editor no navegador com
    # "Não foi possível conectar ao ONLYOFFICE" mesmo com tudo mais certo
    # (bug real, achado em produção 2026-08-09).
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-log:/var/log/onlyoffice
      - onlyoffice-config:/etc/onlyoffice/documentserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  onlyoffice-data:
  onlyoffice-log:
  onlyoffice-config:
